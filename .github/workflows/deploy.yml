name: CD - Deploy to EC2
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      - name: Connect to EC2 and deploy
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          REPO_URL: ${{ secrets.REPO_URL }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@$EC2_HOST << EOF
            set -e
            mkdir -p ~/expenses.management.api
            cd ~/expenses.management.api

            if [ -d .git ]; then
              echo "Repo already exists. Pulling latest changes..."
              git reset --hard
              git pull origin master
            else
              echo "Cloning repo for the first time..."
              git clone "$REPO_URL" .
            fi

            echo "Creating .env file..."
            printf "%s\n" "$ENV_FILE" > .env

            echo "Stopping existing container"
            docker stop expenses-management-api || true
            docker rm expenses-management-api || true
            docker rmi expenses-management-api || true

            echo "Building Docker image..."
            docker build -t expenses-management-api .

            echo "Running container..."
            docker run -d --name expenses-management-api \
              --env-file .env \
              -p 3000:3000 \
              expenses-management-api
